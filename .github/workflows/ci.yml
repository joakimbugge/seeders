name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Type-check packages
        run: npm run typecheck --workspaces --if-present

      - name: Run tests with coverage
        run: npm run test:cov --workspaces --if-present

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          files: packages/typeorm-seeder/coverage/lcov.info,packages/nest-typeorm-seeder/coverage/lcov.info,packages/mikroorm-seeder/coverage/lcov.info,packages/nest-mikroorm-seeder/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
