name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      # npm only warns about install scripts it skipped, and `install-scripts ls`
      # exits 0 either way, so an unreviewed script would otherwise slip through
      # a dependency bump unnoticed.
      - name: Check for unreviewed install scripts
        run: |
          if ! npm install-scripts ls | grep -q '^No packages with unreviewed install scripts'; then
            npm install-scripts ls
            echo "::error::Dependencies have install scripts not covered by allowScripts. Review them, then run: npm approve-scripts <pkg> --no-allow-scripts-pin"
            exit 1
          fi

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Type-check packages
        run: npm run typecheck --workspaces --if-present

      - name: Run tests with coverage
        run: npm run test:cov --workspaces --if-present

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          files: packages/typeorm-seeder/coverage/lcov.info,packages/nest-typeorm-seeder/coverage/lcov.info,packages/mikroorm-seeder/coverage/lcov.info,packages/nest-mikroorm-seeder/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
